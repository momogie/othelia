# Othelia — nginx reverse proxy (akses via local IP, HTTP, tanpa domain/TLS).
# Dipasang oleh deploy/install.sh ke /etc/nginx/conf.d/othelia.conf.
#
# Port web diisi oleh install.sh (placeholder __LISTEN_PORT__, default 8080):
#   sed "s/__LISTEN_PORT__/<port>/g"
#
# Topologi:
#   :<port> (HTTP)
#     ├── /api/     -> 127.0.0.1:5007  (query API + auth + SSE live)
#     ├── /account/ -> 127.0.0.1:5007  (login Razor backend)
#     └── /         -> static frontend dari folder FE yang di-input install.sh
#                     (root diisi install.sh, placeholder __WEB_ROOT__)
#
# OTLP :4318 TIDAK diekspos publik — cukup terbuka untuk server AppAPI via firewall.
# Untuk TLS: uncomment blok "listen 443 ssl" di bawah, lalu pindahkan semua location ke sana.
# Untuk OTLP over TLS: uncomment location /v1/ + client_max_body_size 64m.

server_tokens off;
client_max_body_size 64m;

server {
    listen __LISTEN_PORT__;
    listen [::]:__LISTEN_PORT__;
    server_name _;

    # ── API backend + SSE ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wajib untuk SSE /api/stream: streaming tanpa buffering + timeout panjang.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # ── Login Razor (auth cookie) ─────────────────────────────────────────
    location /account/ {
        proxy_pass http://127.0.0.1:5007/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenAPI (opsional, dev) ───────────────────────────────────────────
    #location /openapi/ {
    #    proxy_pass http://127.0.0.1:5007/openapi/;
    #    proxy_set_header Host $host;
    #}

    # ── OTLP receiver over TLS (opsional; default direct :4318) ───────────
    #location /v1/ {
    #    proxy_pass http://127.0.0.1:4318/v1/;
    #    proxy_http_version 1.1;
    #    proxy_read_timeout 60s;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #}

    # ── Static frontend (nuxt generate -> .output/public) ─────────────────
    # Folder FE tidak dipindah ke /opt — nginx serve langsung dari folder yang
    # di-input ke install.sh (di-substitusi saat install).
    root __WEB_ROOT__;

    location /_nuxt/ {
        # asset ber-hash: cache lama
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback agar route /traces/{id} dkk. langsung bisa di-refresh.
        try_files $uri $uri/ /index.html;
    }
}

